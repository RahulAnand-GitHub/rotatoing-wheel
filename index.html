<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotating Color Wheel</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: white;
      }

      .wheel-container {
        position: relative;
        width: 350px;
        height: 350px;
      }

      .wheel {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        transition: transform 1.75s ease-in-out;
      }

      .wheel:hover {
        transform: rotate(720deg);
      }

      .portion {
        position: absolute;
        width: 50%;
        height: 50%;
      }

      .red {
        top: 0;
        right: 0;
        background-color: red;
        transform-origin: bottom left;
        transform: rotate(-45deg);
      }

      .green {
        bottom: 0;
        right: 0;
        background-color: green;
        transform-origin: top left;
        transform: rotate(-45deg);
      }

      .yellow {
        bottom: 0;
        left: 0;
        background-color: yellow;
        transform-origin: top right;
        transform: rotate(-45deg);
      }

      .blue {
        top: 0;
        left: 0;
        background-color: blue;
        transform-origin: bottom right;
        transform: rotate(-45deg);
      }

      .inner-hole {
        position: absolute;
        width: 60%;
        height: 60%;
        background-color: white;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <div class="wheel-container">
      <div class="wheel">
        <div class="portion red"></div>
        <div class="portion green"></div>
        <div class="portion yellow"></div>
        <div class="portion blue"></div>
        <div class="inner-hole"></div>
      </div>
    </div>
  </body>
</html>
